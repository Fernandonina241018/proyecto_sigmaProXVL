name: Version stamp

# Sella version.json con el SHA del commit. Con branch protection activa,
# el bot no puede empujar directo a main: abre una rama + PR y lo auto-mergea
# cuando pasan los checks. Requiere el secreto VERSION_STAMP_TOKEN (PAT
# fine-grained con contents:write y pull-requests:write). Sin token, omite
# el sello y avisa; no rompe CI.
on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: version-stamp
  cancel-in-progress: false

jobs:
  stamp:
    if: "!contains(github.event.head_commit.message, '[skip-version]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          token: ${{ secrets.VERSION_STAMP_TOKEN || github.token }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Sellar versión (SHA del commit que disparó el workflow)
        run: node scripts/stamp-version.mjs

      - name: Abrir PR de sello (o avisar si falta el PAT)
        env:
          GH_TOKEN: ${{ secrets.VERSION_STAMP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::VERSION_STAMP_TOKEN no configurado; sello automático omitido."
            exit 0
          fi
          BRANCH="chore/version-stamp-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add version.json indexx.html
          if git diff --cached --quiet; then
            echo "Sin cambios de versión"
            exit 0
          fi
          git commit -m "chore(version): stamp ${GITHUB_SHA::7} [skip-version]"
          git push origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr merge "$BRANCH" --auto --squash --delete-branch || true
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(version): stamp ${GITHUB_SHA::7} [skip-version]" \
              --body "Sello automático de versión. Se auto-mergea cuando pasan los checks."
            gh pr merge "$BRANCH" --auto --squash --delete-branch
          fi
