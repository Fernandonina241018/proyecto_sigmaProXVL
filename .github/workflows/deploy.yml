name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  # GATE — nada llega a producción si el frontend está roto.
  # Motivo: deploy.yml solo gateaba backend y ML; el frontend (vitest +
  # Playwright) no tenía barrera, y un bug de UI llegó a producción.
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Frontend unit (vitest)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # El E2E arranca `node backend/server.js` → necesita las deps del
      # backend (dotenv, express...). El `npm ci` de la raíz no las instala.
      - run: npm ci
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - name: E2E (playwright)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  deploy-backend:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # OPT-8: gate — no desplegar backend con tests rotos.
      # OJO: sin defaults working-directory — flyctl debe correr desde
      # la raíz (fly.toml usa 'backend/Dockerfile' relativo a raíz).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy backend
        run: flyctl deploy --app sigmaproxvl-backend --strategy immediate --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-ml:
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # OPT-8: gate mínimo — el servicio no debe ni compilar roto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile ml_service/main.py ml_service/drift_worker.py ml_service/nlp_models.py
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy ML Service
        run: flyctl deploy --app sigmapro-ml --config ml_service/fly.toml --strategy rolling --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
