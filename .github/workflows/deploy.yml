name: Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # GATE — nada llega a producción si el frontend está roto.
  # Motivo: deploy.yml solo gateaba backend y ML; el frontend (vitest +
  # Playwright) no tenía barrera, y un bug de UI llegó a producción.
  quality-gate:
    if: "!contains(github.event.head_commit.message, '[skip-version]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Frontend unit (vitest)
        run: npm test
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      # El E2E arranca `node backend/server.js` → necesita las deps del
      # backend (dotenv, express...). El `npm ci` de la raíz no las instala.
      - run: npm ci
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - name: E2E (playwright)
        run: npx playwright test
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          # Si el fallo fue antes de Playwright, no hay test-results/: no
          # ensuciar el log con un warning de "no files found".
          if-no-files-found: ignore

  deploy-backend:
    environment: production
    if: "!contains(github.event.head_commit.message, '[skip-version]')"
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # OPT-8: gate — no desplegar backend con tests rotos.
      # OJO: sin defaults working-directory — flyctl debe correr desde
      # la raíz (fly.toml usa 'backend/Dockerfile' relativo a raíz).
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - name: Deploy backend
        run: flyctl deploy --app sigmaproxvl-backend --strategy immediate --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-ml:
    environment: production
    if: "!contains(github.event.head_commit.message, '[skip-version]')"
    needs: [quality-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # OPT-8: gate mínimo — el servicio no debe ni compilar roto
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m py_compile ml_service/main.py ml_service/drift_worker.py ml_service/nlp_models.py
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master
      - name: Deploy ML Service
        run: flyctl deploy --app sigmapro-ml --config ml_service/fly.toml --strategy rolling --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
