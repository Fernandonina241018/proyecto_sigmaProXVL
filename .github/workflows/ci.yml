name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # OPT-8: vitest 4.x exige Node 22+ (antes 18 → suite no corría)
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm test
      # Coverage en modo reporte (sin umbrales bloqueantes aún; ver vitest.config.ts)
      - run: npm run test:coverage

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test
      # LOTE E: coverage backend real (node --test la mide nativo).
      # Los tests usan un DB_FILE temporal por archivo (tests/_db-fixture.js),
      # así que son herméticos: no dependen de backend/data.json.
      - run: node --test --test-concurrency=1 --experimental-test-coverage "tests/*.test.js"
      - run: node -c server.js && node -c database.js && node -c ml-proxy.js && node -c sign-html.js && node -c sign-stamp.js && node -c pdf-render.js
      # Gate: solo HIGH/CRITICAL bloquean. A 2026-10-20 el store está limpio
      # (0 vulnerabilidades) tras actualizar express 4.22.3 + proxy-addr 2.0.8
      # (GHSA-jqcg-44mw-7w3h, IP spoofing). Si vuelve a aparecer una moderate
      # de qs/express4, se documenta aquí; lo que bloquea es high/critical.
      - run: npm audit --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - run: npm ci
      # El E2E arranca `node backend/server.js` → necesita las deps del
      # backend (dotenv, express...). El `npm ci` de la raíz no las instala.
      - run: npm ci
        working-directory: backend
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          # Si el fallo fue antes de Playwright, no hay test-results/: no
          # ensuciar el log con un warning de "no files found".
          if-no-files-found: ignore
