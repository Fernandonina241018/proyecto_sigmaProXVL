version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # Los majors de test/build se revisan en PRs dedicados: rompen stubs y
    # resolución de rutas (Vitest 5 / Vite 8.3 / happy-dom 21).
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]
      - dependency-name: "happy-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: "/ml_service"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # numpy 2.5+ exige Python >=3.12 y la imagen ML usa python:3.11-slim.
    # Revisar este ignore al mover la imagen a 3.12.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.5.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
